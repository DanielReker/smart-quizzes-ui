components:
  schemas:
    AiGenerateQuestionsRequest:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt
    AnswerResponseObject:
      type: object
      discriminator:
        mapping:
          multi-choice: "#/components/schemas/MultiChoiceAnswerResponse"
          single-choice: "#/components/schemas/SingleChoiceAnswerResponse"
          text: "#/components/schemas/TextAnswerResponse"
        propertyName: dtype
      properties:
        answeredAt:
          type:
            - string
            - "null"
          format: date-time
        dtype:
          type: string
        id:
          type: string
          format: uuid
        nextHintsPenalties:
          type: array
          items:
            type: number
        questionDescription:
          type:
            - string
            - "null"
        questionName:
          type: string
        revealedHints:
          type: array
          items:
            $ref: "#/components/schemas/HintDto"
        score:
          type:
            - number
            - "null"
        scoredAt:
          type:
            - string
            - "null"
          format: date-time
        status:
          type:
            - string
            - "null"
          enum:
            - IN_PROCESS
            - ANSWERED
            - UNANSWERED
            - SCORING
            - SCORED
      required:
        - dtype
        - id
        - nextHintsPenalties
        - questionName
        - revealedHints
    AnswerResponseObjectVariant:
      oneOf:
        - $ref: "#/components/schemas/MultiChoiceAnswerResponse"
        - $ref: "#/components/schemas/SingleChoiceAnswerResponse"
        - $ref: "#/components/schemas/TextAnswerResponse"
    AnswerSubmitRequest:
      type: object
      discriminator:
        mapping:
          multi-choice: "#/components/schemas/MultiChoiceAnswerSubmitRequest"
          single-choice: "#/components/schemas/SingleChoiceAnswerSubmitRequest"
          text: "#/components/schemas/TextAnswerSubmitRequest"
        propertyName: dtype
      properties:
        answerId:
          type: string
          format: uuid
        dtype:
          type: string
      required:
        - answerId
        - dtype
    AnswerSubmitRequestVariant:
      oneOf:
        - $ref: "#/components/schemas/MultiChoiceAnswerSubmitRequest"
        - $ref: "#/components/schemas/SingleChoiceAnswerSubmitRequest"
        - $ref: "#/components/schemas/TextAnswerSubmitRequest"
    AnswersSubmitRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerSubmitRequestVariant"
      required:
        - answers
    ChangeCredentialsRequest:
      type: object
      properties:
        currentPassword:
          type:
            - string
            - "null"
        newLogin:
          type:
            - string
            - "null"
          pattern: "^[a-zA-Z0-9._-]{5,30}$"
        newPassword:
          type:
            - string
            - "null"
          maxLength: 2147483647
          minLength: 6
    ChoiceDto:
      type: object
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
        isCorrect:
          type:
            - boolean
            - "null"
        name:
          type: string
        position:
          type: integer
          format: int32
          minimum: 0
      required:
        - name
        - position
    ChoiceStatsDto:
      type: object
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
        id:
          type:
            - string
            - "null"
          format: uuid
      required:
        - count
    ErrorDto:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    HintDto:
      type: object
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
        scorePenalty:
          type: number
          minimum: 0
        sequentialOrder:
          type: integer
          format: int32
        text:
          type: string
      required:
        - scorePenalty
        - sequentialOrder
        - text
    LoginRequest:
      type: object
      properties:
        password:
          type: string
    MultiChoiceAnswerResponse:
      allOf:
        - $ref: "#/components/schemas/AnswerResponseObject"
        - type: object
          properties:
            possibleChoices:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDto"
            selectedChoiceIds:
              type:
                - array
                - "null"
              items:
                type: string
                format: uuid
      required:
        - id
        - nextHintsPenalties
        - possibleChoices
        - questionName
        - revealedHints
    MultiChoiceAnswerSubmitRequest:
      allOf:
        - $ref: "#/components/schemas/AnswerSubmitRequest"
        - type: object
          properties:
            selectedChoiceIds:
              type: array
              items:
                type: string
                format: uuid
      required:
        - answerId
        - selectedChoiceIds
    MultiChoiceQuestionDto:
      allOf:
        - $ref: "#/components/schemas/QuestionDto"
        - type: object
          properties:
            possibleChoices:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDto"
      required:
        - hints
        - isRequired
        - maxScore
        - name
        - position
        - possibleChoices
    MultiChoiceQuestionStatsDto:
      allOf:
        - $ref: "#/components/schemas/QuestionStatsDto"
        - type: object
          properties:
            choiceStats:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceStatsDto"
      required:
        - answerCount
        - choiceStats
        - questionId
    QuestionDto:
      type: object
      discriminator:
        mapping:
          multi-choice: "#/components/schemas/MultiChoiceQuestionDto"
          single-choice: "#/components/schemas/SingleChoiceQuestionDto"
          text: "#/components/schemas/TextQuestionDto"
        propertyName: dtype
      properties:
        description:
          type:
            - string
            - "null"
        dtype:
          type: string
        hints:
          type: array
          items:
            $ref: "#/components/schemas/HintDto"
        id:
          type:
            - string
            - "null"
          format: uuid
        isRequired:
          type: boolean
        maxScore:
          type: number
          minimum: 0
        name:
          type: string
          maxLength: 255
          minLength: 0
        position:
          type: integer
          format: int32
          minimum: 0
      required:
        - dtype
        - hints
        - isRequired
        - maxScore
        - name
        - position
    QuestionDtoVariant:
      oneOf:
        - $ref: "#/components/schemas/MultiChoiceQuestionDto"
        - $ref: "#/components/schemas/SingleChoiceQuestionDto"
        - $ref: "#/components/schemas/TextQuestionDto"
    QuestionStatsDto:
      type: object
      discriminator:
        mapping:
          multi-choice: "#/components/schemas/MultiChoiceQuestionStatsDto"
          single-choice: "#/components/schemas/SingleChoiceQuestionStatsDto"
          text: "#/components/schemas/TextQuestionStatsDto"
        propertyName: dtype
      properties:
        answerCount:
          type: integer
          format: int64
        dtype:
